# GitHub Pages：把 web/ 目录发布成静态站点
#   访问地址：https://<用户名>.github.io/<仓库名>/
#   场景切换：?trace=standard|tight|cluster|wide|random|max
#
#   设计取舍：CI 里**不编译 C 程序**。
#   站点数据（web/traces/）由本地 `tools\build_site.bat` 生成并提交进仓库，
#   CI 只做三件事：校验数据自检（Node，无需编译器）→ 上传 web/ → 发布。
#   好处：队友模块还没写完、或 GitHub 的 Linux 环境缺工具链时，部署也不会挂。
#   需要重新生成数据时：本地跑 tools\build_site.bat，再 commit + push 即可。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 不要取消正在进行的部署：gh-pages 的部署是一个“事务”，
  # 中途被取消会让下一次 deploy-pages 直接失败（我们踩过这个坑）
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 站点数据自检（catalog / 每份 trace / 航段距离一致性）
        run: node tools/check_site.js web

      - name: 确认要发布的内容
        run: |
          echo "web/ 下的文件："
          find web -maxdepth 2 -type f | sort | head -40
          echo "场景：" $(ls -1 web/traces | grep -c '^[a-z]*$' || true)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      # deploy-pages 偶发失败（常见于上一次部署还没收尾时又推了一次），
      # 这里允许失败并重试一次，避免因为一次抖动把整条流水线判红。
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000

      - name: 等待 Pages 释放上一次部署
        if: steps.deployment.outcome == 'failure'
        run: sleep 25

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
